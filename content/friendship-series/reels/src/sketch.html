<!doctype html>
<html><head><meta charset="utf-8"><title>Friendship launch reel</title>
<style>
@font-face{font-family:Caveat;font-weight:700;src:url(node_modules/@fontsource/caveat/files/caveat-latin-700-normal.woff2)}
@font-face{font-family:PatrickHand;font-weight:400;src:url(node_modules/@fontsource/patrick-hand/files/patrick-hand-latin-400-normal.woff2)}
html,body{margin:0;background:#F4ECDF}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#F4ECDF}
#stage svg{position:absolute;inset:0}
.txt{position:absolute;left:0;right:0;text-align:center;color:#2B2622;font-family:Caveat,cursive;font-weight:700;line-height:1.02}
.txt div{display:block;white-space:nowrap}
.adult{color:#8A4B36;line-height:1.08}
.tiph{position:absolute;top:170px;left:50%;transform:translateX(-50%);font:400 46px PatrickHand,cursive;color:#F4ECDF;background:#C8775B;padding:6px 30px 8px;border-radius:999px;letter-spacing:1px}
.small{font-family:PatrickHand,cursive;color:#5A5048}
</style></head>
<body><div id="stage"></div>
<script>
const q = new URLSearchParams(location.search);
document.write('<script src="sketch' + (q.get('reel') && q.get('reel') !== 'launch' ? '-' + q.get('reel') : '') + '.js"><\/script>');
</script>
<script>
window.DURATION = SK.duration;
window.renderAt = t => SK.render(t, q.get('lang') || 'en');
renderAt(Number(q.get('t') || 0));
</script></body></html>
